name: Deploy GrowthKavach to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: growthkavach-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static website
        run: |
          test -s index.html
          mkdir -p _site
          cp index.html .nojekyll _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published GrowthKavach homepage
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          test -n "$SITE_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 15 "${SITE_URL%/}/" -o /tmp/growthkavach-live.html && grep -Fq 'GrowthKavach' /tmp/growthkavach-live.html && grep -Fq 'Digital marketing toolkit' /tmp/growthkavach-live.html; then
              echo "Verified public homepage: $SITE_URL"
              exit 0
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done
          echo 'Deployment completed but the expected homepage could not be verified.' >&2
          exit 1
