name: Cloudflare migration validation
on:
  push:
    branches: [cloudflare-ready]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html && test -s dist/_routes.json && grep -Fq 'const BACKEND_ENABLED=true;' dist/index.html
